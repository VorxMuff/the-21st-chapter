<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday to Bae</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Sriracha&family=Great+Vibes&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fffafc;
    --ink: #b9476d;
    --stub: #f2a9c1;
    --accent: #d77b9c;
    --bg: #fdeef3;
    --polaroid: #ffffff;
    --text: #5a3b46;
    --soft: #9a6b7c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; overflow: hidden; color: var(--text); background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 30%, #fffafc 0%, #fdeef3 60%, #f9dce6 100%);
    background-attachment: fixed; font-family: 'Cormorant Garamond', 'Noto Serif Thai', serif; }

  /* ===== ตั๋ว ===== */
  .scene { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem; padding: 1rem; transition: opacity .8s; }
  .label-top { font-family: Cinzel; letter-spacing: .35em; font-size: .75rem; color: var(--accent); text-transform: uppercase; }
  .hint { font-family: 'Noto Serif Thai'; font-size: .9rem; color: var(--soft); animation: blink 1.6s infinite; transition: opacity .4s; }
  @keyframes blink { 50% { opacity: .35; } }
  .ticket { position: relative; display: flex; width: min(94vw, 620px); aspect-ratio: 2.4 / 1; font-size: min(2.6vw, 16px);
    filter: drop-shadow(0 18px 24px rgba(185,71,109,.28)); animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-.6deg); } }
  .ticket::before, .ticket::after { content: ''; position: absolute; left: 80%; width: 1.3em; height: 1.3em; transform: translateX(-50%); border-radius: 50%; background: var(--bg); z-index: 3; pointer-events: none; }
  .ticket::before { top: -.65em; } .ticket::after { bottom: -.65em; }
  .main { flex: 0 0 80%; position: relative; background: var(--paper); border-radius: .4em 0 0 .4em; color: var(--ink); }
  .main .border { position: absolute; inset: .7em; border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -.35em; }
  .pillar { position: absolute; top: 1.7em; bottom: 1.7em; width: 1.7em; }
  .pillar.left { left: 1.5em; } .pillar.right { right: 1.5em; }
  .pillar::before, .pillar::after { content: ''; position: absolute; left: 0; right: 0; height: .9em; border: 1px solid var(--ink); background: var(--paper); }
  .pillar::before { top: 0; } .pillar::after { bottom: 0; }
  .shaft { position: absolute; top: .9em; bottom: .9em; left: .22em; right: .22em; border-left: 1px solid var(--ink); border-right: 1px solid var(--ink);
    background: repeating-linear-gradient(90deg, transparent 0 .28em, rgba(185,71,109,.5) .28em calc(.28em + 1px)); }
  .content { position: absolute; inset: 1.5em 4.2em; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; font-family: Cinzel; }
  .content .small { font-size: .62em; letter-spacing: .2em; }
  .content h1 { font-size: 2.7em; font-weight: 700; letter-spacing: .16em; line-height: 1; }
  .content h2 { font-size: 1.75em; font-weight: 400; letter-spacing: .2em; margin-top: .15em; }
  .content .to { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 600; font-size: 1.9em; letter-spacing: .04em; margin-top: .1em; }
  .content .details { font-size: .55em; letter-spacing: .14em; }
  .stub { flex: 1; position: relative; background: var(--stub); border-radius: 0 .4em .4em 0; border-left: 2px dashed rgba(255,255,255,.8);
    display: flex; align-items: center; justify-content: center; gap: .7em; cursor: grab; touch-action: none; transform-origin: 0% 100%; user-select: none; }
  .stub:active { cursor: grabbing; }
  .tearzone { position: absolute; left: -30px; top: -22px; bottom: -22px; width: 60px; z-index: 5; cursor: grab; }
  .barcode { width: 1.9em; height: 72%; background: repeating-linear-gradient(180deg, var(--paper) 0 2px, transparent 2px 4px, var(--paper) 4px 5px, transparent 5px 8px, var(--paper) 8px 11px, transparent 11px 13px); }
  .serial { writing-mode: vertical-rl; font-family: Cinzel; font-size: 1.05em; letter-spacing: .2em; color: var(--paper); }
  .stamp { position: absolute; top: 50%; left: 50%; z-index: 4; padding: .15em .6em; font-family: Cinzel; font-weight: 700; font-size: 1.7em; letter-spacing: .15em;
    color: #d6336c; border: .22em double #d6336c; border-radius: .2em; mix-blend-mode: multiply; opacity: 0; transform: translate(-50%,-50%) rotate(-14deg) scale(3);
    transition: transform .35s cubic-bezier(.3,1.6,.6,1), opacity .2s; }
  .stamp.show { opacity: .85; transform: translate(-50%,-50%) rotate(-14deg) scale(1); }

  /* ===== นิทรรศการ ===== */
  .museum { display: none; opacity: 0; transition: opacity 1.2s; padding: 3.5rem 0 4rem; }
  .museum.show { opacity: 1; }
  .museum header { text-align: center; padding: 0 1rem; }
  .museum header .welcome { font-family: Cinzel; letter-spacing: .4em; font-size: .75rem; color: var(--accent); }
  .museum header h1 { font-family: Cinzel; font-size: clamp(1.7rem, 7vw, 3rem); letter-spacing: .12em; margin: .4rem 0; color: var(--ink); }
  .museum header .ornament { color: var(--accent); letter-spacing: .5em; }
  .museum header .sub { font-style: italic; color: var(--soft); font-size: 1.15rem; margin-top: .5rem; }
  .hall { display: flex; gap: 2.5rem; overflow-x: auto; scroll-snap-type: x mandatory; padding: 3.5rem calc(50vw - 135px) 2rem; scrollbar-width: none; }
  .hall::-webkit-scrollbar { display: none; }
  .exhibit { flex: 0 0 270px; scroll-snap-align: center; position: relative; display: flex; flex-direction: column; align-items: center; }
  .polaroid { position: relative; width: 250px; padding: 14px 14px 0; background: var(--polaroid); box-shadow: 0 14px 26px rgba(185,71,109,.28), 0 2px 4px rgba(0,0,0,.12);
    transform: rotate(var(--r)); transition: transform .4s cubic-bezier(.3,1.5,.6,1); cursor: pointer; }
  .polaroid:hover, .polaroid:active { transform: rotate(0) scale(1.04); z-index: 2; }
  .tape { position: absolute; top: -14px; left: 50%; width: 92px; height: 28px; z-index: 2; transform: translateX(-50%) rotate(var(--tr)); background: rgba(245,184,203,.8);
    box-shadow: 0 1px 3px rgba(0,0,0,.15); clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 4% 96%, 0 50%); }
  .photo { position: relative; width: 100%; aspect-ratio: 1; background: #fbe3ea; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo::after { content: ''; position: absolute; inset: 0; background: #fff7f9; opacity: 1; transition: opacity 2.8s ease-out; }
  .exhibit.developed .photo::after { opacity: 0; }
  .caption { padding: 12px 6px 16px; text-align: center; color: #3b3034; font-family: 'Caveat', 'Sriracha', cursive; }
  .caption h3 { font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
  .caption .date { font-size: 1.05rem; color: var(--ink); margin-top: 2px; }
  .note { margin-top: 1.4rem; width: 240px; text-align: center; font-family: 'Sriracha', cursive; font-size: .9rem; line-height: 1.6; color: var(--soft); }
  .swipe { text-align: center; color: var(--soft); font-family: 'Noto Serif Thai'; font-size: .85rem; }

  /* ===== ซองการ์ด ===== */
  .env-section { text-align: center; padding: 5rem 1rem 3rem; }
  .env-section .small { font-family: Cinzel; letter-spacing: .3em; font-size: .7rem; color: var(--ink); }
  .env-section h2 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(2.6rem, 11vw, 3.6rem); color: var(--ink); margin: .3rem 0 0; line-height: 1.2; }
  .env-stage { width: min(86vw, 340px); margin: 11rem auto 7rem; }
  .env { position: relative; width: 100%; aspect-ratio: 3 / 2; cursor: pointer; filter: drop-shadow(0 16px 20px rgba(185,71,109,.3)); }
  .env > div { position: absolute; }
  .env-back { inset: 0; background: #f4b6ca; border-radius: 6px; z-index: 0; }
  .env-front { inset: 0; z-index: 3; border-radius: 6px; pointer-events: none;
    background: linear-gradient(160deg, #f9cddb, #f3a9c0); clip-path: polygon(0 34%, 50% 62%, 100% 34%, 100% 100%, 0 100%); }
  .env-front::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.35), transparent 40%, transparent 60%, rgba(255,255,255,.35)); }
  .flap { inset: 0; z-index: 4; transform-origin: top; background: #eb93b0; clip-path: polygon(0 0, 100% 0, 100% 35%, 50% 63%, 0 35%);
    transition: transform .7s ease, background .7s, z-index 0s .35s; }
  .env.open .flap { transform: rotateX(180deg); background: #dd7f9e; z-index: 1; }
  .seal { left: 50%; top: 60%; width: 44px; height: 44px; margin: -22px; z-index: 6; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #fff; border: 3px solid #ec8fb0; color: #e0557f; font-size: 1.2rem; box-shadow: 0 3px 8px rgba(185,71,109,.35); transition: opacity .3s, transform .3s; }
  .env.open .seal { opacity: 0; transform: scale(.4); }
  .card { left: 4%; width: 92%; bottom: 6%; height: 88%; z-index: 2; perspective: 1200px;
    transition: transform .9s cubic-bezier(.3,1.1,.5,1); }
  .env.rise .card { transform: translateY(-62%); }
  .env.out .card { z-index: 5; transform: translateY(-34%) scale(1.1); cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.4,.2,.2,1); }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 4px; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,.25); }
  .face.front { background: var(--card-bg, #7a1f3d); padding: 7px; }
  .face.front .frame { position: relative; width: 100%; height: 100%; background: transparent; border: 1px solid rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; }
  .face.front svg, .face.front img { width: 78%; height: 100%; object-fit: contain; }
  .face.front .to-you { position: absolute; right: 12px; bottom: 7px; font-style: italic; font-size: .95rem; color: #fff; text-shadow: 0 1px 3px rgba(150,40,80,.5); }
  .face.back { transform: rotateY(180deg); background: var(--paper); color: var(--text); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.1rem .9rem; text-align: center; }
  .face.back .t { font-family: 'Great Vibes', cursive; font-size: 1.9rem; color: var(--ink); line-height: 1.1; }
  .face.back .b { font-family: 'Sriracha', cursive; font-size: .78rem; line-height: 1.75; white-space: pre-line; margin: .5rem 0; }
  .face.back .s { font-family: 'Sriracha', cursive; font-size: .85rem; color: var(--ink); }
  .env-hint { margin-top: 4rem; font-family: 'Noto Serif Thai'; font-size: .9rem; color: var(--soft); animation: blink 1.6s infinite; }
  .ornament { display: flex; justify-content: center; align-items: flex-end; gap: .4rem; letter-spacing: 0; margin: .3rem 0; }
  .heart-deco { width: 150px; margin: 0 auto .8rem; }
  .heart-deco svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 8px rgba(185,71,109,.25)); }
  .cb { position: absolute; width: 28px; height: 28px; opacity: .9; pointer-events: none; }
  .cb.tl { top: 5px; left: 5px; } .cb.br { bottom: 5px; right: 5px; transform: rotate(180deg); }
  .back-btn { margin-top: 2.2rem; padding: .65rem 1.4rem; border: 1px solid var(--ink); border-radius: 999px; background: transparent; color: var(--ink); font-family: 'Noto Serif Thai', serif; font-size: .9rem; cursor: pointer; }
  .back-btn:active { background: var(--ink); color: #fff; }
  .datebox { writing-mode: vertical-rl; font-family: Cinzel; font-weight: 700; font-size: 1.3em; letter-spacing: .2em; color: #fff; padding: .2em .45em; border-left: 1px solid rgba(255,255,255,.7); border-right: 1px solid rgba(255,255,255,.7); }
  
  
  
  .ticket::before, .ticket::after { display: none; }
  .cb.br { transform: none; }
</style>
</head>

      <div class="content">

        <div><h1>HAPPY</h1><h2>BIRTHDAY</h2><p class="to">to Bae ♡</p></div>

</section>

        </div>
        <div class="env-front"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>

      <button class="back-btn" id="backBtn" type="button">↩ กลับไปหน้าตั๋ว</button>
    </div>
  </div>
</section>

function flowerSVG(c) {
  const step = 360 / c.petals;
  const petal = (a, s, o) => `<g transform="rotate(${a}) scale(${s})" opacity="${o}">
    <path d="M0 0C-26 -30 -26 -78 0 -100C26 -78 26 -30 0 0Z" fill="url(#pg)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M0 -6L0 -84" stroke="${c.dark}" stroke-opacity=".45" stroke-width="1.4"/>
    <g fill="${c.dark}" fill-opacity=".6"><circle cx="-6" cy="-36" r="1.6"/><circle cx="7" cy="-48" r="1.8"/><circle cx="-5" cy="-60" r="1.5"/><circle cx="5" cy="-30" r="1.4"/><circle cx="-2" cy="-72" r="1.2"/></g></g>`;
  let back = "", front = "", st = "";
  for (let i = 0; i < c.petals; i++) {
    back += petal(i * step + step / 2, .86, .75);
    front += petal(i * step, 1, 1);
  }
  for (let i = 0; i < 5; i++) {
    const a = -50 + i * 25;
    st += `<g transform="rotate(${a})"><path d="M0 0L0 -42" stroke="${c.stamen}" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="0" cy="-46" rx="3.4" ry="6.5" fill="#8a3a2a"/></g>`;
  }
  return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg" aria-label="flower">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.light}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient></defs>
    ${back}${front}<circle r="9" fill="${c.stamen}" opacity=".9"/>${st}</svg>`;
}
function flowerSVG2(c) {
  const n = c.petals, step = 360 / n;
  const P = "M0 0C-34 -20 -44 -58 -26 -84Q-21 -92 -27 -99Q-8 -97 0 -118Q8 -97 27 -99Q21 -92 26 -84C44 -58 34 -20 0 0Z";
  const spots = [[-9,-34],[8,-42],[-4,-52],[11,-60],[-12,-64],[3,-72],[-6,-80],[14,-48],[-14,-46],[0,-90]];
  const petal = (a, s, id, o) => `<g transform="rotate(${a}) scale(${s})" opacity="${o}"><path d="${P}" fill="url(#${id})" stroke="${c.dark}" stroke-opacity=".55" stroke-width="1.2" stroke-linejoin="round"/><path d="M0 -6Q-3 -60 0 -104M-4 -10Q-22 -50 -16 -88M4 -10Q22 -50 16 -88" fill="none" stroke="${c.dark}" stroke-opacity=".4" stroke-width="1.3"/>${spots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${(1.1 + Math.abs(x) % 1.3).toFixed(1)}" fill="${c.dark}" fill-opacity=".65"/>`).join("")}</g>`;
  let inner = "", outer = "", st = "";
  for (let i = 0; i < n; i++) { inner += petal(i * step + step / 2, .9, "pgIn", .95); outer += petal(i * step, 1, "pgOut", 1); }
  for (let i = 0; i < 6; i++) {
    const len = 34 + (i % 2) * 9;
    st += `<g transform="rotate(${i * 60 + 30})"><path d="M0 0Q7 -${len / 2} 3 -${len}" fill="none" stroke="${c.stamen}" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="3" cy="-${len + 3}" rx="3.2" ry="8" fill="#7a3b22" transform="rotate(8 3 -${len + 3})"/></g>`;
  }
  return `<svg viewBox="-125 -125 250 250" xmlns="http://www.w3.org/2000/svg" aria-label="flower"><defs>
    <linearGradient id="pgOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.light}"/><stop offset=".55" stop-color="${c.light}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient>
    <linearGradient id="pgIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="${c.light}"/><stop offset="1" stop-color="${c.dark}" stop-opacity=".85"/></linearGradient>
    <radialGradient id="thr"><stop offset="0" stop-color="#f6f8b8"/><stop offset="1" stop-color="${c.stamen}"/></radialGradient></defs>
    ${inner}${outer}<circle r="12" fill="url(#thr)"/>${st}<path d="M0 0Q-5 -30 0 -58" fill="none" stroke="${c.stamen}" stroke-width="2.6" stroke-linecap="round"/><circle cy="-60" r="4" fill="#c9e3a0"/></svg>`;
}
function flowerSVG3(c) {
  const n = c.petals, step = 360 / n;
  const P = "M0 0C-13 -22 -27 -56 -17 -86C-13 -101 -6 -113 0 -124C6 -113 13 -101 17 -86C27 -56 13 -22 0 0Z";
  const dots = [[-4,-40],[5,-48],[-6,-60],[4,-66],[-3,-78],[6,-34],[0,-90],[-5,-52],[3,-58]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#c76a8f" fill-opacity=".7"/>`).join("");
  const petal = (a, s, id) => `<g transform="rotate(${a}) scale(${s})"><path d="${P}" fill="url(#${id})" stroke="${c.dark}" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/><path d="M0 -10Q-2 -70 0 -112" fill="none" stroke="${c.dark}" stroke-opacity=".7" stroke-width="1.4"/><path d="M-3 -14Q-14 -60 -10 -92M3 -14Q14 -60 10 -92" fill="none" stroke="${c.dark}" stroke-opacity=".35" stroke-width="1"/>${dots}</g>`;
  let inner = "", outer = "", st = "";
  for (let i = 0; i < n; i++) { inner += petal(i * step + step / 2, .93, "pgIn3"); outer += petal(i * step, 1, "pgOut3"); }
  for (let i = 0; i < 6; i++) {
    const len = 40 + (i % 2) * 10;
    st += `<g transform="rotate(${i * 60 + 30})"><path d="M0 0Q6 -${len / 2} 2 -${len}" fill="none" stroke="${c.stamen}" stroke-width="2" stroke-linecap="round"/><ellipse cx="2" cy="-${len + 4}" rx="3.6" ry="9" fill="#8a3d22" transform="rotate(6 2 -${len + 4})"/><ellipse cx="1" cy="-${len + 7}" rx="1.2" ry="4" fill="#d98a5a"/></g>`;
  }
  return `<svg viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg" aria-label="flower"><defs>
    <linearGradient id="pgOut3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fffafc"/><stop offset=".82" stop-color="${c.dark}"/><stop offset="1" stop-color="#d6e6a6"/></linearGradient>
    <linearGradient id="pgIn3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe4ed"/><stop offset=".6" stop-color="#f1c1d3"/><stop offset="1" stop-color="#cfe3a8"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8a2a4e" flood-opacity=".35"/></filter></defs>
    <g filter="url(#sh3)">${inner}${outer}</g><circle r="9" fill="#b9d98a" stroke="#8fb866" stroke-width="1.5"/>${st}<path d="M0 0Q-4 -34 0 -66" fill="none" stroke="${c.stamen}" stroke-width="2.4" stroke-linecap="round"/><circle cy="-68" r="4" fill="#d4eaa8"/></svg>`;
}

  + f5(60, 50, 15, 0, P1, Y) + f5(140, 50, 15, 20, P1, Y) + f5(100, 84, 17, 10, P2, Y) + f5(62, 98, 13, 30, P2, Y) + f5(138, 98, 13, -10, P2, Y) + f5(100, 130, 12, 0, P1, Y)
  + [[34, 40], [166, 40], [100, 52], [40, 100], [160, 100], [78, 140], [122, 140], [100, 108]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="${P1}"/>`).join("") + `</svg>`;

// เปิดซอง → การ์ดโผล่ → พลิกอ่านด้านหลัง
const env = $("env"), card = $("card"), envHint = $("envHint");
let stage = 0;
env.addEventListener("click", () => {
  if (stage === 0) {
    stage = 1; env.classList.add("open"); envHint.style.opacity = 0;
    setTimeout(() => env.classList.add("rise"), 650);
    setTimeout(() => {
      env.classList.add("out"); stage = 2;
      envHint.textContent = "แตะการ์ดเพื่อพลิกอ่านข้อความด้านหลัง"; envHint.style.opacity = 1;
    }, 1700);
  } else if (stage === 2) {
    card.classList.toggle("flipped");
    envHint.textContent = card.classList.contains("flipped") ? "แตะอีกครั้งเพื่อพลิกกลับ" : "แตะการ์ดเพื่อพลิกอ่านข้อความด้านหลัง";
  }
});

const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("developed"); io.unobserve(en.target); } });
}, { threshold: 0.6 });

// ===== ปุ่มกลับไปหน้าตั๋ว =====
$("backBtn").addEventListener("click", () => {
  const m = $("museum"); m.classList.remove("show");
  setTimeout(() => {
    m.style.display = "none"; document.body.style.overflow = "hidden"; window.scrollTo(0, 0);
    document.querySelectorAll(".exhibit").forEach(el => el.classList.remove("developed"));
    $("hall").scrollLeft = 0;
    env.className = "env"; card.classList.remove("flipped"); stage = 0;
    envHint.textContent = "แตะซองเพื่อเปิด"; envHint.style.opacity = 1;
    torn = false; dragging = false; p = 0; main.style.clipPath = ""; stub.style.cssText = "";
    $("stamp").classList.remove("show"); $("hint").style.opacity = 1;
    const s = $("scene"); s.style.display = "flex";
    requestAnimationFrame(() => requestAnimationFrame(() => { s.style.opacity = 1; }));
  }, 800);
});

// ===== ฉีกตั๋ว =====
const stub = $("stub"), main = $("main");
let dragging = false, torn = false, sx = 0, sy = 0, tTop = 0, tH = 1, p = 0, moved = false;
// รอยฉีกเป็นเส้นประ
const PN = 22, PD = 4, PS = 7;
function perfPts(p) {
  const rp = [], lp = [], N = PN * PS;
  for (let i = 0; i <= N; i++) {
    const y = i / N, u = (y * PN) % 1;
    const bump = PD * Math.sqrt(Math.max(0, 1 - (2 * u - 1) ** 2));
    const t = y <= p, yy = (y * 100).toFixed(2);
    rp.push(`calc(100% - ${t ? (PD - bump).toFixed(2) : 0}px) ${yy}%`);
    lp.push(`${t ? bump.toFixed(2) : 0}px ${yy}%`);
  }
  return { main: `polygon(0 0, ${rp.join(",")}, 0 100%)`, stub: `polygon(${lp.join(",")}, 100% 100%, 100% 0)` };
}
function applyTear(p) {
  const c = perfPts(p);
  main.style.clipPath = c.main; stub.style.clipPath = c.stub;
  stub.style.transform = `rotate(${(p * 26).toFixed(1)}deg)`;
}
stub.addEventListener("pointerdown", e => {
  if (torn) return;
  dragging = true; sx = e.clientX; sy = e.clientY;
  const r = $("ticket").getBoundingClientRect(); tTop = r.top; tH = r.height; p = 0; moved = false;
  stub.setPointerCapture(e.pointerId); stub.style.transition = "none";
});
stub.addEventListener("pointermove", e => {
  if (!dragging) return;
  if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
  p = Math.max(p, Math.min(1, Math.max(0, (e.clientY - tTop) / tH)));
  if (moved) applyTear(p);
  if (p > .93) tear();
});
stub.addEventListener("pointerup", e => {
  if (!dragging) return;
  dragging = false;
  if (p > .55 || !moved) return tear();
  stub.style.transition = "transform .45s cubic-bezier(.3,1.6,.6,1)"; stub.style.transform = "";
  stub.style.clipPath = ""; main.style.clipPath = ""; p = 0;
});
function jagged(side) { const c = perfPts(1); return side === "right" ? c.main : c.stub; }
function ripSound() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * .35, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2 * (Math.random() < .3 ? 1 : .35);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 2500; f.Q.value = .7;
    src.buffer = buf; src.connect(f).connect(ac.destination); src.start();
  } catch (e) {}
}
function tear() {
  if (torn) return;
  torn = true; dragging = false;
  navigator.vibrate?.(40);
  main.style.clipPath = jagged("right"); stub.style.clipPath = jagged("left");
  stub.style.transition = "transform 1.4s cubic-bezier(.55,0,.85,.4), opacity 1.4s";
  stub.style.transform = `translate(40px, 110vh) rotate(${25 + Math.random() * 30}deg)`;
  stub.style.opacity = "0"; $("hint").style.opacity = "0";
  setTimeout(() => $("stamp").classList.add("show"), 700);
  setTimeout(enterMuseum, 2600);
}
function enterMuseum() {
  $("scene").style.opacity = "0";
  setTimeout(() => {
    $("scene").style.display = "none";
    $("museum").style.display = "block";
    document.body.style.overflow = "auto";
    requestAnimationFrame(() => requestAnimationFrame(() => $("museum").classList.add("show")));
    setTimeout(() => document.querySelectorAll(".exhibit").forEach(el => io.observe(el)), 900);
  }, 800);
}
